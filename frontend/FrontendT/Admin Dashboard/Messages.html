<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | Admin Dashboard</title>
  <link rel="stylesheet" href="Messages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> 
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=dashboard" /> 
</head>
<body>
  <div class="container">
    <!-- Sidebar Navigation -->
    <aside id="sidebar">
      <div class="top">
        <div class="logo">
          <img src="Images/Filter.png" alt="Tour Edo Logo">
        </div>
        <!-- Close Button (Mobile Only) -->
        <button type="button" class="close" id="closebtn" aria-label="Close menu">
          <span class="fas fa-times" aria-hidden="true"></span>
        </button>
      </div> 
      <div class="sidebar">
        <a href="AdminDashboard.html">
          <span><i class="fa-solid fa-grip-vertical"></i></span>
          <h3>Dashboard</h3>
        </a>
        <a href="Tourist.html">
          <span><i class="fa-solid fa-user-tie"></i></span>
          <h3>Tourists</h3>
        </a>
        <a href="Bookings.html">
          <span><i class="fa-solid fa-plane-departure"></i></span>
          <h3>Bookings</h3>
        </a>
        <a href="Destinations.html">
          <span><i class="fa-solid fa-map-location-dot"></i></span>
          <h3>Destinations</h3>
        </a>
        <a href="Analytics.html">
          <span><i class="fa-solid fa-chart-line"></i></span>
          <h3>Analytics</h3>
        </a>
        <a href="Messages.html" class="active">
          <span><i class="fa-solid fa-message"></i></span>
          <h3>Messages</h3>
        </a>
        <a href="Report.html">
          <span><i class="fa-solid fa-file-circle-exclamation"></i></span>
          <h3>Reports</h3>
        </a>
        <a href="Settings.html">
          <span><i class="fa-solid fa-gear"></i></span>
          <h3>Settings</h3>
        </a>
        <a href="/Login.html">
          <span><i class="fa-solid fa-sign-out-alt"></i></span>
          <h3>Logout</h3>
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main>
      <div class="top-bar">
        <!-- Open Menu Button (Mobile Only) -->
        <button type="button" id="menubtn" aria-label="Open menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1><i class="fa-solid fa-message"></i> Messages</h1>
      </div>

      <section class="message-list">
        <h2><i class="fa-solid fa-comments"></i> Inbox</h2>
        <p class="text-muted">
          Messaging is unavailable
        </p>
      </section>
    </main>
  </div>

  <script src="Messages.js"></script>
</body>
</html>
