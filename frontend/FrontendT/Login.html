<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="Login.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"/>
</head>
<body>
  <div class="container">
    <div class="form-box">
      <img src="Images/Filter.png" alt="">
      <h1>Login</h1>
    <form action="" class="admin">
      <div>
      <span class="icon"><i class="fa-solid fa-envelope"></i></span>
      <input type="email" name="email" id="RGE" placeholder="Email" required> <br> <br>

      <span class="icon"><i class="fa-solid fa-lock"></i></span>
      <input type="password" name="password" id="RGP" placeholder="Password" minlength="6" required> <br> <br>
      <select name="role" id="role">
        <option selected disabled> ---Login As---</option>
        <option>Admin</option>
        <option>Tourist</option>
      </select> 
     <p id="FG"> <a href=""> Forgot Password?</a></p>
      </div> <br>
       <button type="submit" onclick="openPopUp()"> Login </button>
    </form>
    <p> No account? Don't worry <a href="Register.html"> Click here to register</a></p>
    
    <div class="popUp" id="popUp">
        <i class="fa-solid fa-handshake" id="thumbs"></i>

        <h2 id="congratulations">Welcome to Tour Edo! </h2>
        <p>You have successfully logged in.</p>
        <button type="button" id="closePopUp" onclick="closePopUp()">Close</button>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="Login.js"></script>
</body>
</html>
