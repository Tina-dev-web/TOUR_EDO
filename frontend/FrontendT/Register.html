<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <link rel="stylesheet" href="Register.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"/>
</head>
<body>
  <div class="container">
    <div class="form-box">
      <img src="Images/Filter.png" alt="logo">
<h1>Registration</h1>

    <form class="admin">
     <div>
      <span class="icon"><i class="fa-solid fa-user"></i></span>
      <input type="text" name="name" id="RGN" placeholder="Name" required > <br> <br>

       <span class="icon"><i class="fa-solid fa-envelope"></i></span>
      <input type="email" name="email" id="RGE" placeholder="Email" required> <br> <br>

      <span class="icon"><i class="fa-solid fa-lock"></i></span>
      <input type="password" name="password" id="RGP" placeholder="Password" required minlength="6"> <br> <br>
      <select name="role" id="role" title="Role" required>
        <option selected disabled> ---Select Role---</option>
        <option>Tourist</option>
        <option>Guide</option>
      </select>
     </div> <br>
       <button type="submit" id="registerBtn"> Sign Up</button>
    </form>
    <p> Already have an account? <a href="Login.html"> Click here to login</a></p>
  </div>
    </div>
    <div class="popUp" id="popUp">
        <i class="fa-solid fa-handshake" id="thumbs"></i>

        <h2 id="congratulations">Congratulations! </h2>
        <p>You have successfully registered.</p>
        <button type="button" id="closePopUp" onclick="closePopUp()">Close</button>
      </div>


    <script src="config.js"></script>
    <script src="Register.js"></script>
</body>
</html>
