<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites - Tourism Dashboard</title>
  <link rel="stylesheet" href="Favourites.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
  <div class="container">
    <aside id="sidebar-container">
      <div class="top">
        <div class="logo">
          <img src="Images/Filter.png" alt="Logo">
        </div>
        <div class="close" id="closebtn">
          <span class="fas fa-times"></span>
        </div>
      </div>
      <div class="sidebar">
        <a href="UserDashbboard.html">
          <span><i class="fa-solid fa-grip-vertical"></i></span>
          <h3>Dashboard</h3>
        </a>
        <a href="Attractions.html">
          <span><i class="fa-solid fa-map-location-dot"></i></span>
          <h3>Attractions</h3>
        </a>
        <a href="My Bookings.html">
          <span><i class="fa-solid fa-receipt"></i></span>
          <h3>My Bookings</h3>
        </a>
        <a href="#" class="active">
          <span><i class="fa-solid fa-heart"></i></span>
          <h3>Favorites</h3>
        </a>
        <a href="Messages.html">
          <span><i class="fa-solid fa-message"></i></span>
          <h3>Messages</h3>
        </a>
        <a href="Profile.html">
          <span><i class="fa-solid fa-user"></i></span>
          <h3>Profile</h3>
        </a>
        <a href="../Login.html">
          <span><i class="fa-solid fa-right-from-bracket"></i></span>
          <h3>Logout</h3>
        </a>
      </div>
    </aside>

    <!-- Main Favorites Section -->
    <main class="main-content">
      <header class="main-header">
       <div class="mobile-header">
        <button id="menubtn" class="menu-trigger">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h2>Favourites</h2>
      </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search your saved places...">
        </div>
      </header>

      <div class="categories">
        <button class="category-btn active">All</button>
        <button class="category-btn">Nature</button>
        <button class="category-btn">Culture &amp; Heritage</button>
        <button class="category-btn">Adventure</button>
      </div>

      <!-- Favorites grid -->
      <p id="loading" class="text-muted">Loading favourites...</p>
      <p id="errorMessage" class="text-muted" hidden></p>
      <div id="emptyState" class="empty-state" hidden>
        <i class="fa-regular fa-heart"></i>
        <h3>No favourites yet</h3>
        <p>Places you save while browsing will show up here.</p>
        <a href="Attractions.html" class="btn-book">Explore Attractions</a>
      </div>
      <div id="favouritesContainer" class="favorites-grid"></div>
    </main>

    <!-- Right Profile Panel -->
    <div class="right-panel">
      <div class="profile-section">
        <div class="profile-photo"></div>
        <div class="profile-info">
          <b id="profile-name">Loading...</b>
          <p class="text-muted" id="profile-role"></p>
        </div>
      </div>
    </div>
  </div>
  <script src="../config.js"></script>
  <script src="Favourites.js"></script>
</body>
</html>
