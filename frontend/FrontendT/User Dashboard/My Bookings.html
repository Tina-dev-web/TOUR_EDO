<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - Tourism Dashboard</title>
  <link rel="stylesheet" href="My Bookings.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
  <div class="container">
    <!-- Sidebar Navigation -->
    <aside id="sidebar">
      <div class="top">
        <div class="logo">
          <img src="Images/Filter.png" alt="Logo">
        </div>
        <div class="close" id="closebtn">
          <span class="fas fa-times"></span>
        </div>
      </div>
      <div class="sidebar">
        <a href="UserDashbboard.html">
          <span><i class="fa-solid fa-grip-vertical"></i></span>
          <h3>Dashboard</h3>
        </a>
        <a href="Attractions.html">
          <span><i class="fa-solid fa-map-location-dot"></i></span>
          <h3>Attractions</h3>
        </a>
        <!-- Active Link for Bookings Page -->
        <a href="#" class="active">
          <span><i class="fa-solid fa-receipt"></i></span>
          <h3>My Bookings</h3>
        </a>
        <a href="Favourites.html">
          <span><i class="fa-solid fa-heart"></i></span>
          <h3>Favorites</h3>
        </a>
        <a href="Messages.html">
          <span><i class="fa-solid fa-message"></i></span>
          <h3>Messages</h3>
        </a>
        <a href="Profile.html">
          <span><i class="fa-solid fa-user"></i></span>
          <h3>Profile</h3>
        </a>
        <a href="../Login.html">
          <span><i class="fa-solid fa-right-from-bracket"></i></span>
          <h3>Logout</h3>
        </a>
      </div>
    </aside>

    <!-- Main Bookings Section -->
    <main class="main-content">
      <header class="main-header">
        <button id="menubtn" class="menu-trigger" aria-label="Open menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1>My Bookings</h1>
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search booking ID or destination...">
        </div>
      </header>

      <!-- Booking Status Filters -->
      <div class="categories">
        <button class="category-btn active">All Bookings</button>
        <button class="category-btn">Upcoming</button>
        <button class="category-btn">Completed</button>
        <button class="category-btn">Cancelled</button>
        <button class="category-btn">Add Booking</button>
      </div>

      <!-- Bookings Cards Container -->
      <div class="attractions-grid"></div>
    </main>

    <!-- Right Profile Panel -->
    <div class="right-panel">
      <div class="profile-section">
        <div class="profile-photo"></div>
        <div class="profile-info">
          <b>User Account</b>
          <p class="text-muted">Tourist Explorer</p>
        </div>
      </div>
    </div>
  </div>
  <script src="../../js/api.js"></script>
<script src="../config.js"></script>
<script src="My Bookings.js"></script>
</body>
</html>
