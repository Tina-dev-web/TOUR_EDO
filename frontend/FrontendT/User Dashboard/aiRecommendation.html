<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Recommendations</title>
  <link rel="stylesheet" href="aiRecommendation.css">
</head>

<body>

  <div class="booking-container">

    <h1>AI Travel Recommendations</h1>

    <p>Tell us what kind of experience you're looking for.</p>

    <form id="aiForm">

      <label for="interest">What are you interested in?</label>
      <input
        type="text"
        id="interest"
        placeholder="e.g. culture, history, nature"
        required
      >

      <label for="budget">Budget</label>
      <input
        type="number"
        id="budget"
        placeholder="e.g. 50000"
        required
      >

      <label for="location">Location</label>
      <input
        type="text"
        id="location"
        placeholder="e.g. Benin City"
        required
      >

      <label for="duration">Duration</label>
      <input
        type="text"
        id="duration"
        placeholder="e.g. 3 days"
        required
      >

      <button type="submit">
        Get AI Recommendations
      </button>

    </form>

    <div id="loading" style="display: none;">
      Getting your recommendations...
    </div>

    <div id="result"></div>

  </div>

 <script src="../../js/api.js"></script>
<script src="aiRecommendation.js"></script>

</body>
</html>
