<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password - Tour Edo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/password.css">
</head>

<body>

  <div class="password-container">

    <div class="icon">
      <div class="lock"></div>
    </div>

    <h1>Oops! Forgot your password?</h1>

    <p class="dramatic-text">
      Don't panic. It's just your password — not your life.
    </p>

    <p>
      We've got you. Enter the email you used to create your Tour Edo
      account and we'll send you a link to reset your password.
    </p>

    <form id="forgotPasswordForm">

      <label for="email">Your Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        required
      >

      <button type="submit">
        Send Me the Reset Link
      </button>

    </form>

    <p id="message"></p>

    <p class="back-login">
      Remember your password?
      <a href="login.html">Back to Login</a>
    </p>

  </div>

  <script src="js/password.js"></script>

</body>
</html>
